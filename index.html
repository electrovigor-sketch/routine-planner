<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#20183d"><link rel="manifest" href="manifest.json"><title>همراه من | پلنر جامع</title><style>
:root{--bg:#f5f3fb;--card:#fff;--ink:#292440;--muted:#817b98;--p:#7056c9;--line:#e8e3f3;--good:#168568;--bad:#c54e70}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.8 Tahoma,Arial,sans-serif}.app{max-width:760px;margin:auto;padding-bottom:85px}.hero{padding:23px 18px;color:white;background:linear-gradient(135deg,#20183d,#6448b7,#9680e5);border-radius:0 0 28px 28px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:bold}.date{background:#ffffff20;padding:5px 10px;border-radius:12px;font-size:12px}.hero h1{font-size:22px;margin:15px 0 0}.hero p{font-size:12px;margin:0;opacity:.8}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:17px}.stat{background:#ffffff18;border:1px solid #ffffff25;border-radius:14px;padding:9px}.stat small{display:block;font-size:11px}.stat b{font-size:17px}.main{padding:15px}.head{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px}.head h2{font-size:17px;margin:0}.panel,.module{background:white;border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:12px;box-shadow:0 6px 20px #36205b0a}.modules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.module{margin:0;text-align:right;width:100%;color:var(--ink);min-height:98px}.module span{display:block;font-size:24px}.module b{display:block}.module small,.muted,small{color:var(--muted);font-size:11px}.btn{background:var(--p);color:white;border:0;border-radius:11px;padding:9px 13px;font-weight:bold}.secondary{background:#f0ecfb;color:var(--p)}.danger{background:#fff0f3;color:var(--bad)}.small{font-size:11px;padding:5px 8px}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:flex;flex-direction:column;gap:3px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted)}input,select,textarea{width:100%;min-width:0;border:1px solid #ded8ef;border-radius:10px;padding:10px;background:white;color:var(--ink);font:inherit}.item{display:flex;align-items:flex-start;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}.grow{flex:1;min-width:0;overflow-wrap:anywhere}.grow b{display:block}.tag{display:inline-block;padding:1px 7px;border-radius:18px;background:#f0ecfb;color:var(--p);font-size:10px;margin-top:4px}.good{background:#e6f7f0;color:var(--good)}.bad{background:#fff0f3;color:var(--bad)}.navwrap{position:fixed;bottom:0;left:0;right:0;background:#fffffff0;border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:5}.nav{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;background:transparent;color:var(--muted);font:10px Tahoma;padding:5px;border-radius:10px}.nav button span{display:block;font-size:18px}.nav button.active{background:#f0ecfb;color:var(--p);font-weight:bold}.empty{text-align:center;color:var(--muted);padding:18px}.notice{background:#fff7e2;color:#77591e;padding:10px;border-radius:12px;font-size:11px}.progress{height:7px;background:#eeeaf7;border-radius:20px;margin:6px 0}.progress i{display:block;background:var(--p);height:100%;border-radius:20px}.chart{display:flex;align-items:center;gap:7px;margin:9px 0}.chart span{width:65px;font-size:11px}.chart div{flex:1;background:#f0ecfb;height:10px;border-radius:20px;overflow:hidden}.chart i{display:block;background:var(--p);height:100%}.hidden{display:none}@media(min-width:600px){.modules{grid-template-columns:repeat(3,1fr)}.main{padding:22px}}
</style></head><body><div class="app"><header class="hero"><div class="top"><div><div class="brand">✦ همراه من</div><small style="color:#eee">پلنر جامع زندگی و کسب‌وکار</small></div><div class="date" id="date"></div></div><h1>قدم‌های کوچک، پیشرفت بزرگ</h1><p>کارها، پول، کسب‌وکار و زندگی‌ات؛ همه در یک جا.</p><div class="stats"><div class="stat"><small>کارهای باز</small><b id="stasks">۰</b></div><div class="stat"><small>اقساط باز</small><b id="sbills">۰</b></div><div class="stat"><small>درآمد ثبت‌شده</small><b id="sincome">۰</b></div></div></header><main class="main" id="view"></main></div><div class="navwrap"><nav class="nav"><button class="active" data-page="home"><span>⌂</span>خانه</button><button data-page="tasks"><span>✓</span>کارها</button><button data-page="money"><span>◈</span>مالی</button><button data-page="business"><span>▦</span>کسب‌وکار</button><button data-page="more"><span>☷</span>بیشتر</button></nav></div>
<script>
const D={tasks:[],habits:[],bills:[],tx:[],customers:[],products:[],goals:[],health:[],study:[],family:[],notes:[],businesses:['شخصی','الکترو ویگور','نیل بیوتی']};let db;try{db={...D,...JSON.parse(localStorage.getItem('hamrah-planner-v1')||'{}')}}catch(e){db={...D}}let page='home';const $=s=>document.querySelector(s),fa=n=>Number(n||0).toLocaleString('fa-IR'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5),today=()=>new Date().toISOString().slice(0,10),jd=()=>new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'long',day:'numeric'}).format(new Date()),money=n=>fa(n)+' تومان';
function save(){localStorage.setItem('hamrah-planner-v1',JSON.stringify(db));stats()}function stats(){$('#date').textContent=jd();$('#stasks').textContent=fa(db.tasks.filter(x=>!x.done).length);$('#sbills').textContent=fa(db.bills.filter(x=>!x.paid).length);$('#sincome').textContent=fa(db.tx.filter(x=>x.type==='درآمد').reduce((a,x)=>a+ +x.amount,0))}
function panel(t,b,act=''){return `<section class="panel"><div class="head"><h2>${t}</h2>${act}</div>${b}</section>`}function empty(t='هنوز موردی ثبت نشده است.'){return `<div class="empty">${t}</div>`}function list(arr,fn,msg){return arr.length?arr.map(fn).join(''):empty(msg)}function btn(t,a,c='btn'){return `<button class="${c}" data-act="${a}">${t}</button>`}
function biz(){return `<select name="business">${db.businesses.map(x=>`<option>${esc(x)}</option>`).join('')}</select>`}
function taskForm(){return `<form id="taskForm" class="form"><div class="field full"><label>عنوان کار</label><input name="title" required placeholder="مثلاً تماس با مشتری"></div><div class="field"><label>تاریخ</label><input name="date" type="date" value="${today()}"></div><div class="field"><label>دسته</label><select name="cat"><option>شخصی</option><option>کاری</option><option>خانواده</option><option>سلامتی</option><option>یادگیری</option></select></div><div class="field"><label>کسب‌وکار</label>${biz()}</div><div class="field"><label>اولویت</label><select name="priority"><option>معمولی</option><option>مهم</option><option>فوری</option></select></div><button class="btn field full">ذخیره کار</button></form>`}
function billForm(){return `<form id="billForm" class="form"><div class="field full"><label>عنوان قسط، بدهی یا طلب</label><input name="title" required placeholder="مثلاً قسط وام"></div><div class="field"><label>مبلغ (تومان)</label><input name="amount" type="number" required min="0"></div><div class="field"><label>سررسید</label><input name="date" type="date" value="${today()}"></div><div class="field"><label>نوع</label><select name="kind"><option>قسط</option><option>بدهی</option><option>طلب</option><option>قبض</option></select></div><div class="field"><label>کسب‌وکار</label>${biz()}</div><div class="field full"><label>یادداشت</label><input name="note"></div><button class="btn field full">ثبت</button></form>`}
function txForm(){return `<form id="txForm" class="form"><div class="field full"><label>شرح تراکنش</label><input name="title" required placeholder="مثلاً فروش یا خرید کالا"></div><div class="field"><label>مبلغ (تومان)</label><input name="amount" type="number" min="0" required></div><div class="field"><label>نوع</label><select name="type"><option>هزینه</option><option>درآمد</option></select></div><div class="field"><label>تاریخ</label><input name="date" type="date" value="${today()}"></div><div class="field"><label>دسته</label><input name="cat" placeholder="فروش، خرید، حقوق"></div><div class="field"><label>کسب‌وکار</label>${biz()}</div><button class="btn field full">ثبت تراکنش</button></form>`}
function taskRow(x){return `<div class="item"><input type="checkbox" data-check="${x.id}" ${x.done?'checked':''} style="margin-top:7px"><div class="grow"><b>${esc(x.title)}</b><small>${esc(x.date||'بدون تاریخ')} · ${esc(x.cat||'شخصی')} · ${esc(x.business||'')}</small></div><button class="btn danger small" data-del="tasks:${x.id}">×</button></div>`}
function billRow(x){return `<div class="item"><div class="grow"><b>${esc(x.title)}</b><small>${esc(x.date||'بدون سررسید')} · ${esc(x.kind)} · ${esc(x.business||'')}</small><div><span class="tag ${x.paid?'good':'bad'}">${x.paid?'پرداخت شد':'پرداخت نشده'}</span> <span class="tag">${money(x.amount)}</span></div></div><button class="btn secondary small" data-paid="${x.id}">${x.paid?'برگشت':'پرداخت'}</button><button class="btn danger small" data-del="bills:${x.id}">×</button></div>`}
function txRow(x){return `<div class="item"><div class="grow"><b>${esc(x.title)}</b><small>${esc(x.date)} · ${esc(x.cat||'عمومی')} · ${esc(x.business||'')}</small></div><b style="color:${x.type==='درآمد'?'var(--good)':'var(--bad)'}">${x.type==='درآمد'?'+':'−'}${fa(x.amount)}</b><button class="btn danger small" data-del="tx:${x.id}">×</button></div>`}
function home(){let inc=db.tx.filter(x=>x.type==='درآمد').reduce((a,x)=>a+ +x.amount,0),exp=db.tx.filter(x=>x.type==='هزینه').reduce((a,x)=>a+ +x.amount,0);return `<div class="head"><h2>نمای کلی امروز</h2><small>${jd()}</small></div><div class="modules"><button class="module" data-goto="tasks"><span>✅</span><b>کارها و عادت‌ها</b><small>${fa(db.tasks.filter(x=>!x.done).length)} کار باز</small></button><button class="module" data-goto="money"><span>💳</span><b>اقساط و بدهی‌ها</b><small>${fa(db.bills.filter(x=>!x.paid).length)} مورد باز</small></button><button class="module" data-goto="business"><span>🛍️</span><b>کسب‌وکار و فروش</b><small>${fa(db.customers.length)} مشتری · ${fa(db.products.length)} کالا</small></button></div>${panel('کارهای پیش رو',list(db.tasks.filter(x=>!x.done).slice(0,4),taskRow,'همه کارها انجام شده!'),btn('همه کارها','goto:tasks','btn secondary'))}${panel('پرداخت‌های باز',list(db.bills.filter(x=>!x.paid).slice(0,4),billRow,'قسطی ثبت نشده.'),btn('مدیریت مالی','goto:money','btn secondary'))}${panel('خلاصه مالی',`<p>درآمد: <b style="color:var(--good)">${money(inc)}</b></p><p>هزینه: <b style="color:var(--bad)">${money(exp)}</b></p><p>مانده خالص: <b>${money(inc-exp)}</b></p>`)}<div class="notice">اطلاعات در مرورگر همین گوشی ذخیره می‌شود. از بخش «بیشتر ← پشتیبان‌گیری» مرتب فایل پشتیبان بگیر.</div>`}
function tasks(){return panel('افزودن کار',taskForm())+panel('عادت‌های روزانه',`<form id="habitForm" class="form"><div class="field full"><input name="title" required placeholder="مثلاً پیاده‌روی صبحگاهی"></div><button class="btn field full">افزودن عادت</button></form>${list(db.habits,x=>`<div class="item"><div class="grow"><b>${esc(x.title)}</b><small>تعداد پیگیری: ${fa(x.count)}</small></div><button class="btn secondary small" data-habit="${x.id}">انجام شد</button><button class="btn danger small" data-del="habits:${x.id}">×</button></div>`,'عادتی اضافه نشده.')}`)+panel('همه کارها',list(db.tasks.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')),taskRow,'کاری ثبت نشده.'))}
function moneyPage(){let inc=db.tx.filter(x=>x.type==='درآمد').reduce((a,x)=>a+ +x.amount,0),exp=db.tx.filter(x=>x.type==='هزینه').reduce((a,x)=>a+ +x.amount,0);return `<div class="modules"><div class="module"><small>درآمد</small><b>${money(inc)}</b></div><div class="module"><small>هزینه</small><b>${money(exp)}</b></div></div>${panel('ثبت درآمد یا هزینه',txForm())}${panel('ثبت قسط، بدهی یا طلب',billForm())}${panel('اقساط و بدهی‌ها',list(db.bills.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')),billRow,'موردی ثبت نشده.'))}${panel('دفتر درآمد و هزینه',list(db.tx.slice().reverse(),txRow,'تراکنشی ثبت نشده.'))}`}
function businessPage(){return panel('کسب‌وکارهای من',`<div>${db.businesses.map(x=>`<span class="tag">${esc(x)}</span>`).join(' ')}</div><form id="bizForm" class="form" style="margin-top:10px"><div class="field full"><input name="name" required placeholder="نام کسب‌وکار جدید"></div><button class="btn field full">افزودن کسب‌وکار</button></form>`)+panel('CRM | ثبت مشتری',`<form id="custForm" class="form"><div class="field"><label>نام مشتری</label><input name="name" required></div><div class="field"><label>شماره تماس</label><input name="phone" inputmode="tel"></div><div class="field"><label>وضعیت پیگیری</label><select name="status"><option>مشتری جدید</option><option>در حال مذاکره</option><option>خرید انجام شد</option><option>نیازمند پیگیری</option></select></div><div class="field"><label>کسب‌وکار</label>${biz()}</div><div class="field full"><label>یادداشت</label><input name="note"></div><button class="btn field full">ذخیره مشتری</button></form>`)+panel('مشتریان',list(db.customers,x=>`<div class="item"><div class="grow"><b>${esc(x.name)}</b><small>${esc(x.phone||'بدون شماره')} · ${esc(x.business||'')}</small><div class="tag">${esc(x.status)}</div><small>${esc(x.note||'')}</small></div><button class="btn danger small" data-del="customers:${x.id}">×</button></div>`,'مشتری ثبت نشده.'))+panel('ثبت کالا و موجودی',`<form id="prodForm" class="form"><div class="field full"><label>نام کالا</label><input name="name" required></div><div class="field"><label>موجودی</label><input name="qty" type="number" min="0" value="1"></div><div class="field"><label>قیمت فروش</label><input name="price" type="number" min="0"></div><div class="field full"><label>کسب‌وکار</label>${biz()}</div><button class="btn field full">ثبت کالا</button></form>`)+panel('موجودی',list(db.products,x=>`<div class="item"><div class="grow"><b>${esc(x.name)}</b><small>موجودی ${fa(x.qty)} · ${money(x.price)}</small></div><button class="btn secondary small" data-stock="${x.id}">−۱</button><button class="btn danger small" data-del="products:${x.id}">×</button></div>`,'کالایی ثبت نشده.'))}
function simpleForm(key,label,ph,amountLabel='مقدار'){return `<form class="form simple" data-key="${key}"><div class="field full"><label>${label}</label><input name="title" required placeholder="${ph}"></div><div class="field"><label>تاریخ</label><input name="date" type="date" value="${today()}"></div><div class="field"><label>${amountLabel}</label><input name="amount" type="number" min="0"></div><button class="btn field full">ثبت</button></form>`}
function more(){return `<div class="modules"><button class="module" data-goto="goals"><span>🎯</span><b>هدف‌گذاری</b><small>پیگیری پیشرفت</small></button><button class="module" data-goto="health"><span>💚</span><b>سلامتی و ورزش</b><small>ثبت فعالیت‌ها</small></button><button class="module" data-goto="family"><span>🏡</span><b>خانواده و زندگی</b><small>قرارها و امور خانه</small></button><button class="module" data-goto="study"><span>📚</span><b>یادگیری و مطالعه</b><small>ثبت مطالعه</small></button><button class="module" data-goto="reports"><span>📊</span><b>گزارش‌ها</b><small>خلاصه عملکرد</small></button><button class="module" data-goto="backup"><span>💾</span><b>پشتیبان‌گیری</b><small>خروجی و بازیابی</small></button></div>${panel('یادداشت و یادآور',`<form id="noteForm" class="form"><div class="field full"><textarea name="text" required placeholder="چیزی که نباید فراموش کنی"></textarea></div><button class="btn field full">ذخیره یادداشت</button></form>`)}${panel('یادداشت‌ها',list(db.notes,x=>`<div class="item"><div class="grow">${esc(x.text)}<small>${esc(x.date)}</small></div><button class="btn danger small" data-del="notes:${x.id}">×</button></div>`,'یادداشتی ثبت نشده.'))}`}
function goals(){db.goals.forEach(g=>{if(!Array.isArray(g.steps))g.steps=[]});let total=db.goals.reduce((n,g)=>n+g.steps.length,0),done=db.goals.reduce((n,g)=>n+g.steps.filter(t=>t.done).length,0),overall=total?Math.round(done/total*100):0;return panel('ساخت هدف جدید',`<form id="goalForm" class="form"><div class="field full"><label>عنوان هدف</label><input name="title" required placeholder="مثلاً افزایش فروش الکترو ویگور"></div><div class="field full"><label>توضیحات (اختیاری)</label><textarea name="description" rows="2" placeholder="چرا این هدف مهم است؟"></textarea></div><div class="field full"><label>مهلت انجام هدف (اختیاری)</label><input name="deadline" type="date"></div><button class="btn field full">＋ افزودن هدف</button></form>`)+panel('نمای کلی پیشرفت هدف‌ها',`<div style="display:flex;justify-content:space-between;align-items:center"><b>${fa(done)} از ${fa(total)} کار انجام شده</b><b>${fa(overall)}٪</b></div><div class="progress" style="height:10px"><i style="width:${overall}%"></i></div><small>درصد کلی بر اساس تعداد کارهای تیک‌خورده محاسبه می‌شود.</small>`)+panel('هدف‌های من',list(db.goals,x=>{let steps=x.steps||[],n=steps.filter(t=>t.done).length,p=steps.length?Math.round(n/steps.length*100):0;return `<div style="width:100%"><div class="item" style="align-items:flex-start"><div class="grow"><b style="font-size:15px">🎯 ${esc(x.title)}</b>${x.description?`<small>${esc(x.description)}</small>`:''}<small>${x.deadline?'مهلت: '+esc(x.deadline)+' · ':''}${fa(n)} از ${fa(steps.length)} کار · ${fa(p)}٪</small><div class="progress" style="height:9px"><i style="width:${p}%"></i></div><div class="chart"><span>پیشرفت</span><div><i style="width:${p}%"></i></div><b>${fa(p)}٪</b></div></div><button class="btn danger small" data-del="goals:${x.id}" title="حذف هدف">×</button></div><form class="form goalStepForm" data-goal-id="${x.id}" style="margin:8px 0 12px"><div class="field full"><label>کار جدید برای این هدف</label><input name="title" required placeholder="مثلاً آماده‌سازی تصاویر محصولات"></div><button class="btn secondary field full">＋ افزودن کار به هدف</button></form>${steps.length?steps.map(t=>`<div class="item" style="align-items:center"><input type="checkbox" data-step-check="${x.id}" data-step-id="${t.id}" ${t.done?'checked':''} style="width:20px;height:20px;flex:0 0 20px"><div class="grow"><b style="font-weight:normal;${t.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(t.title)}</b>${t.done?'<small class="tag good">انجام‌شده</small>':'<small class="tag">در انتظار انجام</small>'}</div><button class="btn danger small" data-step-del="${x.id}" data-step-id="${t.id}">×</button></div>`).join(''):'<div class="empty">هنوز کاری برای این هدف تعریف نکرده‌ای.</div>'}<div style="height:8px"></div></div>`},'هنوز هدفی نساخته‌ای. از فرم بالا شروع کن.'))}
function simplePage(key,title,ph,amountLabel){return panel(title,simpleForm(key,title,ph,amountLabel))+panel('سوابق',list(db[key],x=>`<div class="item"><div class="grow"><b>${esc(x.title)}</b><small>${esc(x.date)} · ${x.amount?fa(x.amount)+' '+esc(amountLabel):''}</small></div><button class="btn danger small" data-del="${key}:${x.id}">×</button></div>`,'موردی ثبت نشده.'))}
function reports(){let inc=db.tx.filter(x=>x.type==='درآمد').reduce((a,x)=>a+ +x.amount,0),exp=db.tx.filter(x=>x.type==='هزینه').reduce((a,x)=>a+ +x.amount,0),m=Math.max(inc,exp,1);return panel('گزارش عملکرد',`<div class="chart"><span>درآمد</span><div><i style="width:${inc/m*100}%"></i></div><b>${fa(inc)}</b></div><div class="chart"><span>هزینه</span><div><i style="width:${exp/m*100}%"></i></div><b>${fa(exp)}</b></div><hr><p>کارهای انجام‌شده: <b>${fa(db.tasks.filter(x=>x.done).length)}</b></p><p>کارهای باز: <b>${fa(db.tasks.filter(x=>!x.done).length)}</b></p><p>مشتریان: <b>${fa(db.customers.length)}</b> · کالاها: <b>${fa(db.products.length)}</b></p>`)}
function backup(){return panel('پشتیبان‌گیری',`<p>یک نسخه از اطلاعات را در فایل JSON ذخیره کن و در جای امن نگه دار.</p><button class="btn" id="export">دانلود نسخه پشتیبان</button><div class="divider"></div><div class="field"><label>انتخاب فایل پشتیبان</label><input id="file" type="file" accept=".json,application/json"></div><button class="btn secondary" id="import" style="margin-top:10px">بازیابی فایل</button>`)+panel('توجه',`اطلاعات در همین مرورگر و همین آدرس ذخیره می‌شود و خودکار با دستگاه دیگر همگام نیست. قبل از پاک‌کردن داده‌های مرورگر، پشتیبان بگیر.`)}
function render(){let map={home:home,tasks:tasks,money:moneyPage,business:businessPage,more:more,goals:goals,health:()=>simplePage('health','ثبت فعالیت سلامتی','پیاده‌روی، خواب، آب یا ورزش','واحد'),family:()=>simplePage('family','قرار و کار خانوادگی','خرید خانه یا قرار خانوادگی','مقدار'),study:()=>simplePage('study','ثبت مطالعه و یادگیری','موضوع کتاب یا دوره','دقیقه'),reports:reports,backup:backup};$('#view').innerHTML=(map[page]||home)();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));stats();wire()}
function form(idn,fn){let f=$('#'+idn);if(!f)return;f.onsubmit=e=>{e.preventDefault();fn(Object.fromEntries(new FormData(f)));save();render()}}
function wire(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>go(b.dataset.goto));document.querySelectorAll('[data-act]').forEach(b=>{if(b.dataset.act.startsWith('goto:'))b.onclick=()=>go(b.dataset.act.slice(5))});document.querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>{let x=db.tasks.find(x=>x.id===b.dataset.check);if(x)x.done=b.checked;save();render()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('این مورد حذف شود؟')){let [k,i]=b.dataset.del.split(':');db[k]=db[k].filter(x=>x.id!==i);save();render()}});document.querySelectorAll('[data-paid]').forEach(b=>b.onclick=()=>{let x=db.bills.find(x=>x.id===b.dataset.paid);if(x)x.paid=!x.paid;save();render()});document.querySelectorAll('[data-habit]').forEach(b=>b.onclick=()=>{let x=db.habits.find(x=>x.id===b.dataset.habit);x.count++;save();render()});document.querySelectorAll('[data-stock]').forEach(b=>b.onclick=()=>{let x=db.products.find(x=>x.id===b.dataset.stock);if(x.qty>0)x.qty--;save();render()});document.querySelectorAll('[data-step-check]').forEach(b=>b.onchange=()=>{let g=db.goals.find(x=>x.id===b.dataset.stepCheck);let t=g?.steps?.find(x=>x.id===b.dataset.stepId);if(t)t.done=b.checked;save();render()});document.querySelectorAll('[data-step-del]').forEach(b=>b.onclick=()=>{if(confirm('این کار حذف شود؟')){let g=db.goals.find(x=>x.id===b.dataset.stepDel);if(g)g.steps=g.steps.filter(x=>x.id!==b.dataset.stepId);save();render()}});document.querySelectorAll('.goalStepForm').forEach(f=>f.onsubmit=e=>{e.preventDefault();let g=db.goals.find(x=>x.id===f.dataset.goalId);if(!g)return;if(!Array.isArray(g.steps))g.steps=[];g.steps.push({id:id(),title:new FormData(f).get('title').trim(),done:false});save();render()});
form('taskForm',x=>db.tasks.unshift({...x,id:id(),done:false}));form('billForm',x=>db.bills.unshift({...x,id:id(),amount:+x.amount,paid:false}));form('txForm',x=>db.tx.unshift({...x,id:id(),amount:+x.amount}));form('habitForm',x=>db.habits.unshift({id:id(),title:x.title,count:0}));form('bizForm',x=>{if(!db.businesses.includes(x.name))db.businesses.push(x.name)});form('custForm',x=>db.customers.unshift({...x,id:id()}));form('prodForm',x=>db.products.unshift({...x,id:id(),qty:+x.qty,price:+x.price}));form('goalForm',x=>db.goals.unshift({title:x.title.trim(),description:x.description||'',deadline:x.deadline||'',id:id(),steps:[]}));form('noteForm',x=>db.notes.unshift({...x,id:id(),date:jd()}));document.querySelectorAll('.simple').forEach(f=>f.onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(f));db[f.dataset.key].unshift({...x,id:id(),amount:+x.amount||0});save();render()});
if($('#export'))$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='hamrah-planner-backup.json';a.click();URL.revokeObjectURL(a.href)};if($('#import'))$('#import').onclick=async()=>{let f=$('#file').files[0];if(!f)return alert('اول فایل را انتخاب کن');try{let x=JSON.parse(await f.text());if(!x.tasks||!x.bills)throw 0;db={...D,...x};save();render();alert('بازیابی انجام شد')}catch(e){alert('فایل معتبر نیست')} }}
function go(p){page=p;render()}if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
